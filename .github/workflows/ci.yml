name: Atelie Breda checks and Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atelier-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo export --platform all
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-platform-bundles
          path: dist/
  android:
    if: github.ref_name != 'ci/ios-verification'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: atelier-debug-key-${{ github.repository }}
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Build internal test APK (release mode, debug signing)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --stacktrace
        env:
          NODE_ENV: production
      - uses: actions/upload-artifact@v4
        with:
          name: atelie-breda-android-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
  ios-simulator:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == 'ci/ios-verification'
    needs: validate
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npx expo prebuild --platform ios --no-install
      - run: pod install --project-directory=ios
      - name: Build unsigned simulator app
        run: xcodebuild -workspace ios/AteliBreda.xcworkspace -scheme AteliBreda -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: atelie-breda-ios-simulator
          path: ios/build/Build/Products/Release-iphonesimulator/*.app
          if-no-files-found: error
